<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Agent Metrics</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main id="monitor" aria-label="Codex 代理监视器">
  <header class="app-header">
    <div><strong>Codex Agent Metrics</strong><span class="host" id="host-name">当前插件宿主</span></div>
    <span class="connection" id="connection" role="status">正在连接</span>
  </header>
  <div class="notice" id="notice" hidden role="status"></div>
  <section class="overview" aria-label="Working 和 Ready 会话速率总览">
    <div class="overview-line">
      <div title="最近 3 秒的总输出速率; 数字经短暂平滑, 图表显示原始采样."><span class="muted">总输出速率</span> <strong id="total-rate" class="total-rate">-</strong><span class="muted"> tok/s</span></div>
      <span class="muted" id="activity-summary">正在读取 Codex 数据</span>
    </div>
    <div class="agent-count-line" title="仅统计 Working 代理, 按模型和档位组合分组."><span class="muted">活跃模型</span><div class="agent-counts" id="model-counts">正在读取</div></div>
    <div class="agent-count-line model-rate-line" id="model-rate-row" hidden><span class="muted" title="各组最近样本之前 5 分钟的有效请求均速; 空闲时保留上次统计.">近期均速</span><div class="model-rates" id="model-rates"></div></div>
    <div class="freshness-info" id="data-freshness" role="status" hidden></div>
    <div class="global-timeline-heading"><strong title="当前 Working + Ready 集合的最近 5 分钟速率, 不随列表筛选变化; 已离开监视范围的代理不计入.">全局时间线</strong><label class="background-control" title="隐藏页面后继续采集. 此开关仅作用于当前后台进程, 重启后关闭."><input type="checkbox" id="background-enabled" disabled><span>后台采集</span><span class="sr-only" id="background-status">正在读取</span></label></div>
    <div id="global-rate-chart"></div>
  </section>
  <div class="view-bar">
    <div class="tabs" role="tablist" aria-label="监视视图">
      <button type="button" id="live-tab" role="tab" aria-selected="true" aria-controls="live-view">实时</button>
      <button type="button" id="history-tab" role="tab" aria-selected="false" aria-controls="history-view">用量历史</button>
      <button type="button" id="diagnostics-tab" role="tab" aria-selected="false" aria-controls="diagnostics-view">诊断</button>
    </div>
    <label class="live-control"><span class="sr-only">会话范围</span><select id="thread-scope"><option value="all">Working + Ready</option><option value="working">Working</option><option value="ready">Ready</option></select></label>
    <label class="live-control"><span class="sr-only">会话排序</span><select id="thread-order"><option value="recent">最近交互</option><option value="priority">Working 优先</option></select></label>
  </div>
  <section id="live-view" role="tabpanel" aria-labelledby="live-tab">
    <div id="thread-list" class="thread-list" aria-label="根会话列表"></div>
    <div id="thread-empty" class="empty" hidden>没有符合范围的 Working / Ready 会话</div>
    <div class="list-foot"><span id="thread-count">-</span></div>
  </section>
  <section id="history-view" role="tabpanel" aria-labelledby="history-tab" hidden>
    <div class="history-summary" id="history-summary">正在读取历史用量</div>
    <div class="history-chart" id="history-chart"></div>
    <div class="history-table-wrap"><table class="history-table"><thead><tr><th scope="col">日期</th><th scope="col">输入 tokens</th><th scope="col">输出 tokens</th><th scope="col">请求</th><th scope="col">均速 tok/s</th></tr></thead><tbody id="history-rows"></tbody></table></div>
    <div class="history-foot" id="history-coverage">按日采样 · 含 reasoning</div>
  </section>
  <section id="diagnostics-view" role="tabpanel" aria-labelledby="diagnostics-tab" hidden>
    <dl class="diagnostics-facts"><dt>日志路径</dt><dd id="diagnostics-path">尚未取得</dd><dt>后端版本 / 等级</dt><dd id="diagnostics-version">-</dd><dt>日志写入</dt><dd id="diagnostics-write">-</dd><dt>跳过压缩文件</dt><dd id="diagnostics-skipped">-</dd></dl>
    <h2 class="diagnostics-heading">采样时钟</h2><pre class="diagnostics-clock" id="diagnostics-clock"></pre>
    <h2 class="diagnostics-heading">界面错误 / 最近 100 条</h2><pre class="diagnostics-events" id="diagnostics-client">暂无错误</pre>
    <h2 class="diagnostics-heading">后端事件</h2><pre class="diagnostics-events" id="diagnostics-backend">尚未取得后端诊断</pre>
  </section>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
