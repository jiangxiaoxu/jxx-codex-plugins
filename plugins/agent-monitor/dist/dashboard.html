<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Monitor</title>
  <style>:root {
  color-scheme: light dark;
  --monitor-bg: var(--color-background-primary, light-dark(#fbfbfc, #191a1d));
  --monitor-fg: var(--color-text-primary, light-dark(#24272e, #eceef2));
  --monitor-muted: var(--color-text-secondary, light-dark(#626973, #abb1bc));
  --monitor-line: var(--color-border-secondary, light-dark(#dedfe4, #363940));
  --monitor-soft: var(--color-background-secondary, light-dark(#f1f2f5, #24272d));
  --monitor-selected: var(--color-background-info, light-dark(#eaf0fc, #27354e));
  --monitor-blue: light-dark(#4e73b8, #9db7ee);
  --monitor-purple: light-dark(#9474b9, #c1a3e2);
  --monitor-green: light-dark(#658e7e, #9bc8b2);
  --monitor-orange: light-dark(#b78040, #d6b17e);
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--monitor-fg); background: var(--monitor-bg); font: 13px/1.45 var(--font-sans, system-ui, sans-serif); }
button, select { font: inherit; color: inherit; background: var(--monitor-bg); border: 1px solid var(--monitor-line); border-radius: 5px; padding: 5px 8px; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--monitor-blue); outline-offset: 2px; }
strong, b { font-weight: 600; }
[hidden] { display: none !important; }
.muted, .host, .connection { color: var(--monitor-muted); font-size: 12px; }
.app-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 5px 12px; padding: 8px 12px; border-bottom: 1px solid var(--monitor-line); }
.host { margin-left: 12px; overflow-wrap: anywhere; }
.connection { white-space: nowrap; }
.notice { padding: 9px 14px; background: var(--monitor-soft); font-size: 12px; overflow-wrap: anywhere; }
.notice[data-error="true"] { color: var(--color-text-danger, light-dark(#9b3232, #f2a4a4)); }
.overview { padding: 7px 12px 9px; }
.overview-line { display: flex; align-items: center; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.total-rate { font-size: 27px; font-variant-numeric: tabular-nums; font-weight: 500; }
.agent-count-line { display: flex; align-items: baseline; gap: 5px 10px; margin-top: 5px; font-size: 12px; }
.agent-count-line > .muted { flex: 0 0 50px; }
.agent-counts { display: flex; flex-wrap: wrap; gap: 5px 14px; }
.agent-count { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.model-rates { display: flex; flex-wrap: wrap; gap: 5px 14px; }
.model-rate { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.model-rate time { color: var(--monitor-muted); font-size: 11px; white-space: nowrap; }
.overview-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; color: var(--monitor-muted); font-size: 11px; }
.freshness-info, .coverage-info { margin-top: 4px; color: var(--monitor-muted); font-size: 11px; }
.global-timeline-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; }
.global-timeline-heading span { color: var(--monitor-muted); font-size: 11px; }
.background-control { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; width: fit-content; font-size: 12px; }
.background-control input { margin: 0; accent-color: var(--monitor-blue); }
#monitor[data-health="stale"] .total-rate, #monitor[data-health="stale"] .thread-rate, #monitor[data-health="stale"] .agent-rate { color: var(--monitor-muted); }
#monitor[data-health="stale"] .freshness-info { color: var(--color-text-warning, light-dark(#8a5b22, #e1ba87)); }
.view-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 8px; padding: 5px 12px; background: var(--monitor-soft); border-block: 1px solid var(--monitor-line); }
.tabs { display: flex; gap: 2px; margin-right: auto; }
.tabs button { border-color: transparent; background: transparent; font-size: 12px; }
.tabs button[aria-selected="true"] { background: var(--monitor-bg); border-color: var(--monitor-line); }
.view-bar select { font-size: 12px; }
.thread-list { max-height: 620px; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.group-heading { padding: 6px 14px; background: var(--monitor-soft); color: var(--monitor-muted); font-size: 11px; }
.thread-row { border-bottom: 1px solid var(--monitor-line); }
.thread-toggle { display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: 0; border-radius: 0; text-align: left; }
.thread-toggle[aria-expanded="true"] { background: var(--monitor-soft); }
.thread-name { display: block; font-weight: 500; overflow-wrap: anywhere; }
.thread-meta { display: block; margin-top: 2px; color: var(--monitor-muted); font-size: 11px; }
.thread-rate { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.thread-rate small { color: var(--monitor-muted); font-size: 11px; font-weight: 400; }
.thread-detail { padding: 8px 12px 10px; }
.thread-models { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 7px 0 0; color: var(--monitor-muted); font-size: 11px; }
.agent-layout { display: grid; grid-template-columns: minmax(180px, .8fr) minmax(0, 1.6fr); gap: 10px; }
.agent-column { min-width: 0; }
.main-agent { margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid var(--monitor-line); }
.thread-overview-row { margin-bottom: 5px; border: 1px solid var(--monitor-line); }
.agent-section-label { margin: 9px 0 5px; color: var(--monitor-muted); font-size: 11px; }
.inspector-note { margin: 9px 0 0; color: var(--monitor-muted); font-size: 11px; }
.sub-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 5px; color: var(--monitor-muted); font-size: 11px; }
.sub-head select { padding: 3px 5px; font-size: 11px; }
.agent-list { max-height: 260px; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.agent-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; width: 100%; padding: 6px 7px; text-align: left; border: 0; border-radius: 4px; }
.agent-row[aria-pressed="true"] { background: var(--monitor-selected); }
.agent-name { display: block; font-size: 12px; overflow-wrap: anywhere; }
.agent-meta { color: var(--monitor-muted); font-size: 11px; overflow-wrap: anywhere; }
.agent-rate { text-align: right; align-self: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.agent-rate span { display: block; color: var(--monitor-muted); font-size: 11px; }
.inspector { min-width: 0; padding-left: 10px; border-left: 1px solid var(--monitor-line); }
.inspector-head { display: flex; justify-content: space-between; gap: 8px; align-items: start; font-size: 12px; }
.inspector-model { margin: 4px 0 8px; font-size: 12px; overflow-wrap: anywhere; }
.inspector-configuration { margin: -4px 0 8px; color: var(--monitor-muted); font-size: 11px; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; margin: 0; font-size: 11px; }
.facts dt { color: var(--monitor-muted); }
.facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; margin-top: 8px; }
.metric-grid > div { min-width: 0; }
.metric-grid dd { margin-top: 1px; text-align: left; font-size: 13px; }
.agent-metadata { margin-top: 6px; color: var(--monitor-muted); font-size: 11px; }
.agent-metadata summary { cursor: pointer; width: fit-content; }
.agent-metadata .facts { margin-top: 5px; }
.rate-timeline { margin-top: 7px; }
.curve-controls { display: flex; align-items: center; justify-content: space-between; gap: 5px; flex-wrap: wrap; font-size: 11px; color: var(--monitor-muted); }
.curve-controls > div { display: flex; gap: 3px; }
.curve-controls button { padding: 3px 7px; font-size: 11px; }
.agent-curve { position: relative; width: 100%; height: 140px; margin-top: 3px; touch-action: pan-y; cursor: crosshair; user-select: none; }
#global-rate-chart .rate-timeline { margin-top: 3px; }
#global-rate-chart .agent-curve { height: 125px; }
.agent-curve:focus-visible { outline: 2px solid var(--monitor-blue); outline-offset: 2px; }
.curve-svg, .agent-curve svg { display: block; width: 100%; height: 100%; }
.curve-empty { padding-top: 50px; color: var(--monitor-muted); font-size: 12px; }
.curve-tooltip { position: absolute; top: 4px; z-index: 1; width: min(220px, 100%); padding: 8px 10px; pointer-events: none; border: 1px solid var(--monitor-line); border-radius: 5px; background: var(--monitor-bg); box-shadow: 0 3px 12px #0002; font-size: 11px; font-variant-numeric: tabular-nums; }
.curve-tooltip dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 5px 0; }
.curve-tooltip dt, .curve-tooltip > span { color: var(--monitor-muted); }
.curve-tooltip dd { margin: 0; text-align: right; }
.curve-help { margin-top: 4px; color: var(--monitor-muted); font-size: 10px; }
.curve-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 8px; color: var(--monitor-muted); font-size: 11px; }
.load-sentinel { padding: 7px; color: var(--monitor-muted); font-size: 11px; text-align: center; }
.list-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; padding: 9px 14px; color: var(--monitor-muted); font-size: 11px; }
.empty { padding: 24px 14px; color: var(--monitor-muted); text-align: center; font-size: 12px; }
.history-summary { padding: 11px 14px 0; color: var(--monitor-muted); font-size: 12px; }
.history-chart { height: 150px; padding: 9px 14px; }
.history-chart svg { display: block; width: 100%; height: 100%; }
.history-table-wrap { max-height: 300px; overflow: auto; margin: 0 14px; }
.history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.history-table th, .history-table td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--monitor-line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.history-table th { position: sticky; top: 0; background: var(--monitor-bg); color: var(--monitor-muted); font-weight: 400; }
.history-table th:first-child, .history-table td:first-child { text-align: left; }
.history-foot { padding: 9px 14px; color: var(--monitor-muted); font-size: 11px; }
.diagnostics-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin: 12px 14px; font-size: 12px; }
.diagnostics-facts dt { color: var(--monitor-muted); }
.diagnostics-facts dd { margin: 0; overflow-wrap: anywhere; }
.diagnostics-heading { margin: 12px 14px 5px; font-size: 12px; font-weight: 500; }
.diagnostics-clock, .diagnostics-events { margin: 0 14px 12px; padding: 8px; background: var(--monitor-soft); font: 11px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.diagnostics-events { max-height: 160px; overflow: auto; }
#diagnostics-view { max-height: 455px; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (min-width: 1000px) {
  .metric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .agent-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 570px) {
  .agent-layout { grid-template-columns: 1fr; }
  .inspector { padding: 10px 0 0; border-left: 0; border-top: 1px solid var(--monitor-line); }
  .thread-toggle { gap: 8px; }
  .host { display: block; margin: 2px 0 0; }
  .thread-list { max-height: 720px; }
  .agent-list { max-height: 180px; }
  .overview-line { align-items: baseline; }
}
@media (pointer: coarse) { button, select { min-height: 44px; } }
</style>
</head>
<body>
<main id="monitor" aria-label="Codex 代理监视器">
  <header class="app-header">
    <div><strong>Agent Monitor</strong><span class="host" id="host-name">当前插件宿主</span></div>
    <span class="connection" id="connection" role="status">正在连接</span>
  </header>
  <div class="notice" id="notice" hidden role="status"></div>
  <section class="overview" aria-label="Working 和 Ready 会话速率总览">
    <div class="overview-line">
      <div title="最近 3 秒的总输出速率; 数字经短暂平滑, 图表显示原始采样."><span class="muted">总输出速率</span> <strong id="total-rate" class="total-rate">-</strong><span class="muted"> tok/s</span></div>
      <span class="muted" id="activity-summary">正在读取 Codex 数据</span>
    </div>
    <div class="agent-count-line" title="仅统计 Working 代理, 按模型和档位组合分组."><span class="muted">活跃模型</span><div class="agent-counts" id="model-counts">正在读取</div></div>
    <div class="agent-count-line model-rate-line" id="model-rate-row" hidden><span class="muted" title="各组最近样本之前 5 分钟的有效请求均速; 空闲时保留上次统计.">近期均速</span><div class="model-rates" id="model-rates"></div></div>
    <div class="freshness-info" id="data-freshness" role="status" hidden></div>
    <div class="global-timeline-heading"><strong title="当前 Working + Ready 集合的最近 5 分钟速率, 不随列表筛选变化; 已离开监视范围的代理不计入.">全局时间线</strong><label class="background-control" title="隐藏页面后继续采集. 此开关仅作用于当前后台进程, 重启后关闭."><input type="checkbox" id="background-enabled" disabled><span>后台采集</span><span class="sr-only" id="background-status">正在读取</span></label></div>
    <div id="global-rate-chart"></div>
  </section>
  <div class="view-bar">
    <div class="tabs" role="tablist" aria-label="监视视图">
      <button type="button" id="live-tab" role="tab" aria-selected="true" aria-controls="live-view">实时</button>
      <button type="button" id="history-tab" role="tab" aria-selected="false" aria-controls="history-view">用量历史</button>
      <button type="button" id="diagnostics-tab" role="tab" aria-selected="false" aria-controls="diagnostics-view">诊断</button>
    </div>
    <label class="live-control"><span class="sr-only">会话范围</span><select id="thread-scope"><option value="all">Working + Ready</option><option value="working">Working</option><option value="ready">Ready</option></select></label>
    <label class="live-control"><span class="sr-only">会话排序</span><select id="thread-order"><option value="recent">最近交互</option><option value="priority">Working 优先</option></select></label>
  </div>
  <section id="live-view" role="tabpanel" aria-labelledby="live-tab">
    <div id="thread-list" class="thread-list" aria-label="根会话列表"></div>
    <div id="thread-empty" class="empty" hidden>没有符合范围的 Working / Ready 会话</div>
    <div class="list-foot"><span id="thread-count">-</span></div>
  </section>
  <section id="history-view" role="tabpanel" aria-labelledby="history-tab" hidden>
    <div class="history-summary" id="history-summary">正在读取历史用量</div>
    <div class="history-chart" id="history-chart"></div>
    <div class="history-table-wrap"><table class="history-table"><thead><tr><th scope="col">日期</th><th scope="col">输入 tokens</th><th scope="col">输出 tokens</th><th scope="col">请求</th><th scope="col">均速 tok/s</th></tr></thead><tbody id="history-rows"></tbody></table></div>
    <div class="history-foot" id="history-coverage">按日采样 · 含 reasoning</div>
  </section>
  <section id="diagnostics-view" role="tabpanel" aria-labelledby="diagnostics-tab" hidden>
    <dl class="diagnostics-facts"><dt>日志路径</dt><dd id="diagnostics-path">尚未取得</dd><dt>后端版本 / 等级</dt><dd id="diagnostics-version">-</dd><dt>日志写入</dt><dd id="diagnostics-write">-</dd><dt>跳过压缩文件</dt><dd id="diagnostics-skipped">-</dd></dl>
    <h2 class="diagnostics-heading">采样时钟</h2><pre class="diagnostics-clock" id="diagnostics-clock"></pre>
    <h2 class="diagnostics-heading">界面错误 / 最近 100 条</h2><pre class="diagnostics-events" id="diagnostics-client">暂无错误</pre>
    <h2 class="diagnostics-heading">后端事件</h2><pre class="diagnostics-events" id="diagnostics-backend">尚未取得后端诊断</pre>
  </section>
</main>
