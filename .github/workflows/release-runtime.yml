name: Release runtime

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Runtime release tag. Defaults to manifest releaseTag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-runtime:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin
        run: npm run validate:plugin

      - name: Package latest Microsoft Store runtime
        run: node scripts/package-runtime.js --latest-msstore

      - name: Read manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content dist/node-repl-runtime-win32-x64.manifest.json -Raw | ConvertFrom-Json
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = $manifest.releaseTag
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=dist/node-repl-runtime-win32-x64.tar.gz" >> $env:GITHUB_OUTPUT
          "manifest=dist/node-repl-runtime-win32-x64.manifest.json" >> $env:GITHUB_OUTPUT

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.manifest.outputs.tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --notes "Node REPL runtime for Windows x64."
          }
          gh release upload $tag "${{ steps.manifest.outputs.asset }}" "${{ steps.manifest.outputs.manifest }}" --repo $env:GITHUB_REPOSITORY --clobber

      - name: Normalize latest release tag
        shell: pwsh
        run: |
          $latestPath = "plugins/node-repl/runtime/latest.json"
          $latest = Get-Content $latestPath -Raw | ConvertFrom-Json
          $manifest = Get-Content "dist/node-repl-runtime-win32-x64.manifest.json" -Raw | ConvertFrom-Json
          $latest.releaseTag = "${{ steps.manifest.outputs.tag }}"
          $latest.status = "published"
          $latest.assetName = $manifest.assetName
          $latest.manifestAssetName = $manifest.manifestAssetName
          $latest.sha256 = $manifest.sha256
          $latest.size = $manifest.size
          $latest.source = $manifest.source
          $latest.updatedAt = $manifest.createdAt
          $latest | ConvertTo-Json -Depth 20 | Set-Content $latestPath -Encoding utf8

      - name: Commit latest.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/node-repl/runtime/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "latest.json is unchanged."
            exit 0
          }
          git commit -m "Record latest node-repl runtime release" -m "Update runtime/latest.json after packaging the latest Microsoft Store Codex x64 runtime. The binary runtime remains published as GitHub Release assets and is not committed to git."
          git push
