name: Release runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-runtime:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate plugin
        run: npm run validate:plugin

      - name: Package latest Microsoft Store runtime
        run: node scripts/package-runtime.js --latest-msstore

      - name: Check runtime update
        id: runtime
        run: node scripts/check-runtime-update.js --manifest dist/node-repl-runtime-win32-x64.manifest.json

      - name: Create or update release
        if: steps.runtime.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.runtime.outputs.release_tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --notes "Node REPL runtime for Windows x64."
          }
          gh release upload $tag "dist/node-repl-runtime-win32-x64.tar.gz" "dist/node-repl-runtime-win32-x64.manifest.json" --repo $env:GITHUB_REPOSITORY --clobber

      - name: Delete old runtime releases
        if: steps.runtime.outputs.keep_release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${{ steps.runtime.outputs.keep_release_tag }}"
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[].tagName'
          foreach ($tag in $tags) {
            if ($tag -match '^runtime-win32-x64-' -and $tag -ne $currentTag) {
              gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            }
          }

      - name: Update runtime metadata
        if: steps.runtime.outputs.should_release == 'true'
        run: node scripts/update-runtime-metadata.js --manifest dist/node-repl-runtime-win32-x64.manifest.json

      - name: Commit runtime metadata
        if: steps.runtime.outputs.should_release == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/node-repl/.codex-plugin/plugin.json plugins/node-repl/runtime/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Runtime metadata is unchanged."
            exit 0
          }
          git commit -m "Record node-repl runtime ${{ steps.runtime.outputs.package_version }}" -m "Update node-repl plugin metadata after publishing changed runtime assets from Codex package ${{ steps.runtime.outputs.package_version }}. The plugin version is bumped independently from the Codex app version. Runtime change reason: ${{ steps.runtime.outputs.reason }}."
          git push
